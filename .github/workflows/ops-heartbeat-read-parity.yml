name: Ops heartbeat read parity (read-only)

# M11.3R live D1 read-parity probe. This workflow is READ-ONLY: it authenticates
# GET /v1/ops/heartbeats on the worldcons-ops-write boundary with a per-job
# GitHub OIDC token (id-token: write) and compares the five-field records against
# the authoritative Supabase projection. It never calls a heartbeat writer, never
# runs the watchdog, and changes no authority. It exists as a dedicated OIDC
# read-trusted workflow so the read gate cannot be contaminated by the watchdog's
# own heartbeat writes.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional worldcons-ops-write base URL override (defaults to the repo var)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-heartbeat-read-parity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Read-only boundary access, authenticated by OIDC (id-token: write above).
      # No shared token and no Cloudflare write credential is exposed here.
      WORLDCONS_OPS_WRITE_BASE_URL: ${{ github.event.inputs.base_url || vars.WORLDCONS_OPS_WRITE_BASE_URL }}
      WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE: ${{ vars.WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE || 'worldcons-ops-write' }}
      # The authoritative Supabase projection is read with the existing
      # service-role secret, using a plain SELECT only.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare boundary D1 read against Supabase (read-only)
        # --no-direct-d1 keeps the GitHub job free of any Cloudflare credential.
        # The direct-D1 SQL cross-check is a separate controller-owned operator
        # step (see the M11.3R runbook), not a GitHub credential path.
        run: pnpm ops:heartbeat-read-parity -- --run --no-direct-d1 --report --json
      - name: Upload read-parity evidence
        if: ${{ always() && hashFiles('artifacts/cloudflare-m11/m11.3r-read-parity-live-evidence.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: m11.3r-read-parity-live-evidence
          path: artifacts/cloudflare-m11/m11.3r-read-parity-live-evidence.json
          retention-days: 30
          if-no-files-found: error
