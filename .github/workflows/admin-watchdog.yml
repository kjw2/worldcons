name: Admin ops watchdog

on:
  workflow_dispatch:
    inputs:
      m8_idempotency_key:
        description: Stable Cloudflare M8 orchestration identity
        required: false
        default: "manual"
      ops_heartbeat_canary:
        description: Mark only this dispatched run as the M11.3 D1 heartbeat canary
        required: false
        type: boolean
        default: false
      # M11.3R feature-branch dispatch shell. A brand-new
      # ops-heartbeat-read-parity.yml cannot be workflow_dispatch'ed until it
      # exists on the default branch (GitHub returns 404), so this already-present
      # workflow carries the read-only probe for a feature-branch live proof. When
      # true the job skips the watchdog write path entirely and runs ONLY the
      # read-only probe; scheduled and ordinary manual runs are unchanged.
      read_parity_only:
        description: Run only the read-only D1 heartbeat read-parity probe (no watchdog, no writes)
        required: false
        type: boolean
        default: false
      # M11.4R feature-branch dispatch shell. Like read_parity_only above, a
      # brand-new admin-ops-events read-parity workflow cannot be
      # workflow_dispatch'ed before it exists on the default branch (GitHub
      # returns 404), so this already-present workflow carries the read-only
      # admin_ops_events list probe for a feature-branch live proof. When true
      # the job skips the watchdog write path entirely and runs ONLY
      # `pnpm ops:admin-events-read-parity`, which issues authenticated
      # GET /v1/ops/admin-events/list reads and Supabase SELECTs only: no
      # insert, no prune, no watchdog, no heartbeat and no admin-event write.
      # Scheduled and ordinary manual runs never set it.
      admin_ops_events_read_parity_only:
        description: Run only the read-only M11.4R admin_ops_events list read-parity probe (no watchdog, no writes)
        required: false
        type: boolean
        default: false
      # M11.4 live admin_ops_events canary selector. A workflow_dispatch-only
      # boolean defaulting to false, so scheduled and ordinary manual runs never
      # carry the bounded marker. Only an explicit dispatch with
      # admin_ops_events_canary=true sets
      # WORLDCONS_ADMIN_OPS_EVENTS_CANARY_MARKER=true for THIS run, letting the
      # Node writer add detail.m11AdminOpsEventsCanary and the boundary's
      # d1-canary authority select exactly this run.
      admin_ops_events_canary:
        description: Mark only this dispatched run as the M11.4 admin_ops_events D1 canary
        required: false
        type: boolean
        default: false
      # M11.4 combined full-d1 read/write window selector. A
      # workflow_dispatch-only boolean defaulting to false. The ordinary watchdog
      # only exercises the WRITE contract (insert + dedupe read + prune); it never
      # reads the admin list projection. So when true this run additionally runs
      # the read-only admin_ops_events list parity probe AFTER the watchdog, in
      # the SAME dispatch, so one run proves BOTH the D1 write path and the D1
      # list-read parity against Supabase. No canary marker is needed: the
      # combined window uses full `d1` write authority on an ordinary run.
      # Scheduled and ordinary manual runs never set it; a dispatch selects it
      # deliberately and not together with either read-parity-only input.
      admin_ops_events_combined:
        description: Combined M11.4 full-d1 admin_ops_events read/write window (watchdog write + list read parity)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  # M11.3-OIDC: request a short-lived GitHub OIDC token so the heartbeat
  # boundary can authenticate without the shared WORLDCONS_OPS_WRITE_TOKEN
  # repository secret. The token is minted and used only at runtime (never
  # printed), scoped to the dedicated worldcons-ops-write audience.
  id-token: write

concurrency:
  group: admin-ops-watchdog
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M8_IDEMPOTENCY_KEY: ${{ github.event.inputs.m8_idempotency_key || format('manual:{0}', github.run_id) }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_ENABLED: "true"
      CLOUDFLARE_BROWSER_RUN_REQUIRED: "true"
      CLOUDFLARE_BROWSER_RUN_URL: ${{ vars.CLOUDFLARE_BROWSER_RUN_URL }}
      CLOUDFLARE_BROWSER_RUN_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_TOKEN }}
      CRAWLEE_PLAYWRIGHT_ENABLED: "true"
      CRAWLEE_WORKER: "true"
      CRAWLEE_MAX_CONCURRENCY: "1"
      CRAWLEE_PLAYWRIGHT_MAX_CONCURRENCY: "1"
      CRAWLEE_SAME_DOMAIN_DELAY_SECS: "2"
      BVERFG_CRAWL_DELAY_MS: "3000"
      BVERFG_TIMEOUT_MS: "60000"
      BVERFG_MAX_CONCURRENCY: "1"
      BVERFG_RETRY_COUNT: "2"
      BVERFG_DEJURE_PAGES: "4"
      BVERFG_INGEST_RANGE_DAYS: "60"
      BVERFG_USE_IPV4_FIRST: "true"
      FRANCE_CRAWL_DELAY_MS: "3000"
      FRANCE_TIMEOUT_MS: "90000"
      FRANCE_MAX_CONCURRENCY: "1"
      INGEST_RANGE_DAYS: "14"
      SPAIN_INGEST_RANGE_DAYS: "180"
      SPAIN_INGEST_RANGE_DAYS_CAP: "730"
      SPAIN_DISCOVERY_MAX_PAGES: "20"
      SPAIN_REQUEST_DELAY_MS: "2000"
      INGEST_REFRESH_EXISTING: "true"
      # M11.3 ops-heartbeat boundary. Authority defaults to "supabase" so the
      # resting watchdog heartbeat path is unchanged; the base URL is only
      # consulted when the authority is d1-canary/d1. The boundary is
      # authenticated with a per-job GitHub OIDC token (id-token: write above)
      # carrying the dedicated audience, so no shared repository secret is
      # required. WORLDCONS_OPS_WRITE_TOKEN is intentionally NOT set here.
      WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY: ${{ vars.WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY || 'supabase' }}
      # M11.3R read authority is resolved independently of the write authority so
      # a write canary never changes what this watchdog reads. It defaults to
      # "supabase" and is only consulted when explicitly "d1"; it shares the same
      # boundary base URL and OIDC audience and fails closed if D1 is unavailable.
      WORLDCONS_OPS_HEARTBEAT_READ_AUTHORITY: ${{ vars.WORLDCONS_OPS_HEARTBEAT_READ_AUTHORITY || 'supabase' }}
      # M11.3 live D1 canary selector. Only an explicit workflow_dispatch with
      # ops_heartbeat_canary=true pins the marker to THIS run's exact id, so the
      # Node writer adds the bounded detail.m11OpsHeartbeatCanary marker and the
      # boundary's d1-canary authority selects exactly this run. Scheduled runs
      # and ordinary manual runs have no marker and are never selected. The
      # risky shared repo var is deliberately removed: a lingering repo var could
      # make an unrelated watchdog run the canary.
      WORLDCONS_OPS_HEARTBEAT_CANARY_MARKER: ${{ github.event_name == 'workflow_dispatch' && inputs.ops_heartbeat_canary == true && github.run_id || '' }}
      # M11.4 admin_ops_events boundary. Write authority resolves independently
      # from the heartbeat authority and defaults to "supabase", so the resting
      # watchdog write path is unchanged. It reuses the same authenticated
      # boundary base URL and per-job GitHub OIDC token; no shared repository
      # secret is introduced and WORLDCONS_OPS_WRITE_TOKEN stays unset.
      WORLDCONS_ADMIN_OPS_EVENTS_WRITE_AUTHORITY: ${{ vars.WORLDCONS_ADMIN_OPS_EVENTS_WRITE_AUTHORITY || 'supabase' }}
      # M11.4R read authority resolves independently of the write authority so a
      # write canary never changes what the admin ops page reads. Defaults to
      # "supabase" and is only consulted when explicitly "d1"; it fails closed if
      # D1 is unavailable.
      WORLDCONS_ADMIN_OPS_EVENTS_READ_AUTHORITY: ${{ vars.WORLDCONS_ADMIN_OPS_EVENTS_READ_AUTHORITY || 'supabase' }}
      # M11.4 live D1 canary selector. Only an explicit workflow_dispatch with
      # admin_ops_events_canary=true activates the bounded marker for THIS run, so
      # the Node writer adds detail.m11AdminOpsEventsCanary and the boundary's
      # d1-canary authority selects exactly this run. Scheduled and ordinary
      # manual runs have no marker and are never selected. There is deliberately
      # no shared vars.WORLDCONS_ADMIN_OPS_EVENTS_CANARY_MARKER fallback: a
      # lingering repo var could make an unrelated watchdog run the canary.
      WORLDCONS_ADMIN_OPS_EVENTS_CANARY_MARKER: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_ops_events_canary == true && 'true' || '' }}
      WORLDCONS_OPS_WRITE_BASE_URL: ${{ vars.WORLDCONS_OPS_WRITE_BASE_URL }}
      WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE: ${{ vars.WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE || 'worldcons-ops-write' }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M11.4 combined window, read leg. This step runs BEFORE the watchdog write
      # step deliberately: at this point Supabase and D1 still hold the same
      # reconciled rows, so the strict order-aware list parity probe holds on the
      # shared projection. Running it after the watchdog would see the D1-only
      # event this same window just wrote (write authority is full `d1`) and
      # report a false parity difference. The write leg is proven immediately
      # after by the ordinary watchdog step plus Cloudflare Observability.
      - name: Compare boundary admin_ops_events list against Supabase (combined window, read-only)
        if: ${{ inputs.admin_ops_events_combined == true }}
        run: pnpm ops:admin-events-read-parity -- --run --no-direct-d1 --report --json
      - name: Upload combined-window admin_ops_events read-parity evidence
        if: ${{ inputs.admin_ops_events_combined == true && always() && hashFiles('artifacts/cloudflare-m11/m11.4r-admin-ops-events-read-parity-live-evidence.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: m11.4-combined-admin-ops-events-read-parity-live-evidence
          path: artifacts/cloudflare-m11/m11.4r-admin-ops-events-read-parity-live-evidence.json
          retention-days: 30
          if-no-files-found: error
      - name: Evaluate collection health, alert, and compensate
        if: ${{ inputs.read_parity_only != true && inputs.admin_ops_events_read_parity_only != true }}
        run: pnpm ops:watchdog -- --compensate
      # M11.3R feature-branch dispatch shell. This step is the ONLY thing that
      # runs when read_parity_only=true: no recordWorkflowHeartbeat, no watchdog
      # evaluation, no compensation and no write path. It authenticates the
      # read-only GET /v1/ops/heartbeats with the same per-job OIDC id-token and
      # reuses the existing Supabase read secrets, issuing SELECTs only.
      - name: Compare boundary D1 read against Supabase (read-only, no writes)
        if: ${{ inputs.read_parity_only == true }}
        run: pnpm ops:heartbeat-read-parity -- --run --no-direct-d1 --report --json
      - name: Upload read-parity evidence
        if: ${{ inputs.read_parity_only == true && always() && hashFiles('artifacts/cloudflare-m11/m11.3r-read-parity-live-evidence.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: m11.3r-read-parity-live-evidence
          path: artifacts/cloudflare-m11/m11.3r-read-parity-live-evidence.json
          retention-days: 30
          if-no-files-found: error
      # M11.4R feature-branch dispatch shell. This step is the ONLY thing that
      # runs when admin_ops_events_read_parity_only=true: no recordAdminOpsEvent,
      # no recordWatchdogEvents, no watchdog evaluation, no compensation, no
      # insert/prune and no heartbeat write. It authenticates the read-only
      # GET /v1/ops/admin-events/list?limit=20 with the same per-job OIDC
      # id-token and reuses the existing Supabase read secrets, issuing only
      # SELECTs.
      - name: Compare boundary admin_ops_events list against Supabase (read-only, no writes)
        if: ${{ inputs.admin_ops_events_read_parity_only == true }}
        run: pnpm ops:admin-events-read-parity -- --run --no-direct-d1 --report --json
      - name: Upload admin_ops_events read-parity evidence
        if: ${{ inputs.admin_ops_events_read_parity_only == true && always() && hashFiles('artifacts/cloudflare-m11/m11.4r-admin-ops-events-read-parity-live-evidence.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: m11.4r-admin-ops-events-read-parity-live-evidence
          path: artifacts/cloudflare-m11/m11.4r-admin-ops-events-read-parity-live-evidence.json
          retention-days: 30
          if-no-files-found: error
