name: Crawlee worker ingest

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source key, or empty for all active sources
        required: false
        default: ""
      limit:
        description: Per-source ingest limit
        required: false
        default: "20"
      strategy:
        description: auto, cheerio, playwright, sitemap, or seed
        required: false
        default: "auto"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      PLAYWRIGHT_ENABLED: "true"
      CRAWLEE_PLAYWRIGHT_ENABLED: "true"
      CRAWLEE_WORKER: "true"
      BVERFG_CRAWL_DELAY_MS: "3000"
      BVERFG_TIMEOUT_MS: "60000"
      BVERFG_MAX_CONCURRENCY: "1"
      BVERFG_RETRY_COUNT: "2"
      BVERFG_USE_IPV4_FIRST: "true"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Crawlee worker
        run: |
          SOURCE_ARG=""
          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARG="--source=${{ inputs.source }}"
          fi
          pnpm crawl:worker -- $SOURCE_ARG --limit=${{ inputs.limit }} --strategy=${{ inputs.strategy }} --use-playwright --debug
