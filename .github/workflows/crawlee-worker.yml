name: Crawlee worker ingest

# M11.3-OIDC: the crawl/postprocess jobs emit workflow heartbeats, so request a
# short-lived GitHub OIDC token (id-token: write) instead of the shared
# WORLDCONS_OPS_WRITE_TOKEN repository secret. The token is used only at runtime
# and never printed.
permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      m8_idempotency_key:
        description: Stable Cloudflare M8 orchestration identity
        required: false
        default: "manual"
      source:
        description: Source key, or empty for all active sources
        required: false
        default: ""
      limit:
        description: Per-source ingest limit
        required: false
        default: "20"
      strategy:
        description: auto, api, cheerio, playwright, sitemap, or seed
        required: false
        default: "auto"
      range_days:
        description: Only ingest official materials published within this many days
        required: false
        default: "14"
      m11_ingest_run_canary:
        description: Route this dispatched run's ingestion_runs mutations to the M11-B D1 canary
        required: false
        type: boolean
        default: false
      m11_core_canary:
        description: Route this dispatched run's core lifecycle/publication mutations to the M11-C D1 canary
        required: false
        type: boolean
        default: false

concurrency:
  group: admin-command-p1
  cancel-in-progress: false

jobs:
  crawl:
    name: Incremental ingest (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source:
          - de-bverfg
          - us-scotus
          - fr-conseil-constitutionnel
          - es-tribunal-constitucional
    env:
      M8_IDEMPOTENCY_KEY: ${{ github.event.inputs.m8_idempotency_key || format('manual:{0}', github.run_id) }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_SETTINGS_SECRET: ${{ secrets.LLM_SETTINGS_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_SUMMARY_MODEL: ${{ secrets.OPENAI_COMPATIBLE_SUMMARY_MODEL }}
      EMBEDDING_PROVIDER: gemini
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}
      PLAYWRIGHT_ENABLED: "true"
      CLOUDFLARE_BROWSER_RUN_REQUIRED: "true"
      CLOUDFLARE_BROWSER_RUN_URL: ${{ vars.CLOUDFLARE_BROWSER_RUN_URL }}
      CLOUDFLARE_BROWSER_RUN_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_TOKEN }}
      CRAWLEE_PLAYWRIGHT_ENABLED: "true"
      CRAWLEE_WORKER: "true"
      CRAWLER_USER_AGENT: "Mozilla/5.0 (compatible; ConstitutionalCourtCurationBot/0.1; +https://worldcons.soltera.dev/)"
      ADMIN_QUEUE_V3_WORKER_ENABLED: ${{ vars.ADMIN_QUEUE_V3_WORKER_ENABLED || 'false' }}
      ADMIN_QUEUE_V3_WORKER_COMMAND_TYPES: ${{ vars.ADMIN_QUEUE_V3_WORKER_COMMAND_TYPES }}
      ADMIN_QUEUE_V3_WORKER_COHORTS: ${{ vars.ADMIN_QUEUE_V3_WORKER_COHORTS }}
      ARTICLE_LIFECYCLE_P2_SHADOW_WRITE_ENABLED: ${{ vars.ARTICLE_LIFECYCLE_P2_SHADOW_WRITE_ENABLED || 'false' }}
      ARTICLE_LIFECYCLE_P2_SHADOW_COHORTS: ${{ vars.ARTICLE_LIFECYCLE_P2_SHADOW_COHORTS }}
      ADMIN_PUBLICATION_V4_SHADOW_WRITE_ENABLED: ${{ vars.ADMIN_PUBLICATION_V4_SHADOW_WRITE_ENABLED || 'false' }}
      ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED: ${{ vars.ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED || 'false' }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://worldcons.soltera.dev' }}
      WORLDCONS_BASE_URL: ${{ vars.WORLDCONS_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      INGESTION_RUN_STALE_MINUTES: "180"
      INGEST_RANGE_DAYS: "14"
      SCOTUS_REVISION_RECHECK_DAYS: "90"
      SCOTUS_REVISION_RECHECK_LIMIT: "100"
      SPAIN_INGEST_RANGE_DAYS: "180"
      SPAIN_INGEST_RANGE_DAYS_CAP: "730"
      SPAIN_DISCOVERY_MAX_PAGES: "20"
      SPAIN_BACKFILL_MAX_PAGES: "200"
      SPAIN_DISCOVERY_STOP_AFTER_OLD_PAGES: "5"
      SPAIN_HJ_TAIL_PROBE_LIMIT: "30"
      SPAIN_HJ_TAIL_PROBE_EMPTY_STOP: "3"
      SPAIN_PENDING_RECHECK_LIMIT: "20"
      SPAIN_MIN_SOURCE_TEXT_LENGTH: "2000"
      SPAIN_REQUEST_DELAY_MS: "2000"
      INGEST_REFRESH_EXISTING: "true"
      CRAWLEE_MAX_CONCURRENCY: "1"
      CRAWLEE_PLAYWRIGHT_MAX_CONCURRENCY: "1"
      CRAWLEE_SAME_DOMAIN_DELAY_SECS: "2"
      BVERFG_CRAWL_DELAY_MS: "3000"
      # The official BVerfG host regularly exceeds 15s. Keep collection aligned
      # with the diagnostic/admin paths so a healthy but slow response is not
      # misclassified as an uncollected item.
      BVERFG_TIMEOUT_MS: "60000"
      BVERFG_MAX_CONCURRENCY: "1"
      # One request can legitimately occupy the full 60s budget. Variant
      # resolution and the durable candidate retry queue already provide retry;
      # transport retries here only multiply a slow/blocked endpoint.
      BVERFG_RETRY_COUNT: "0"
      BVERFG_SITE_BLOCK_CIRCUIT_THRESHOLD: "3"
      BVERFG_PLAYWRIGHT_ESCALATE_LIMIT: "3"
      BVERFG_PENDING_RECHECK_LIMIT: "3"
      BVERFG_DEJURE_PAGES: "4"
      BVERFG_INGEST_RANGE_DAYS: "60"
      BVERFG_USE_IPV4_FIRST: "true"
      FRANCE_CRAWL_DELAY_MS: "3000"
      FRANCE_TIMEOUT_MS: "90000"
      FRANCE_MAX_CONCURRENCY: "1"
      # M13: ops-heartbeat authority defaults to D1.
      # resting collection heartbeat path is unchanged; the base URL is only
      # consulted when the authority is d1-canary/d1. The boundary is
      # authenticated with a per-job GitHub OIDC token (id-token: write at the
      # workflow level) carrying the dedicated audience, so no shared repository
      # secret is required. WORLDCONS_OPS_WRITE_TOKEN is intentionally NOT set.
      WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY: ${{ vars.WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY || 'd1' }}
      WORLDCONS_OPS_WRITE_BASE_URL: ${{ vars.WORLDCONS_OPS_WRITE_BASE_URL }}
      WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE: ${{ vars.WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE || 'worldcons-ops-write' }}
      WORLDCONS_INGEST_RUN_WRITE_AUTHORITY: ${{ vars.WORLDCONS_INGEST_RUN_WRITE_AUTHORITY || 'd1' }}
      WORLDCONS_INGEST_RUN_CANARY_MARKER: ${{ github.event_name == 'workflow_dispatch' && inputs.m11_ingest_run_canary && github.run_id || '' }}
      WORLDCONS_CORE_WRITE_AUTHORITY: ${{ vars.WORLDCONS_CORE_WRITE_AUTHORITY || 'd1' }}
      WORLDCONS_CORE_WRITE_CANARY_MARKER: ${{ github.event_name == 'workflow_dispatch' && inputs.m11_core_canary && github.run_id || '' }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run M11-C core publication authority canary
        if: github.event_name == 'workflow_dispatch' && inputs.m11_core_canary && matrix.source == 'de-bverfg'
        run: pnpm exec tsx scripts/m11-core-authority-canary.ts
      - name: Validate bounded workflow inputs
        if: (github.event_name != 'workflow_dispatch' || !inputs.m11_core_canary) && (github.event_name != 'workflow_dispatch' || inputs.source == '' || inputs.source == matrix.source)
        env:
          SOURCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.source || '' }}
          LIMIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '20' }}
          STRATEGY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'auto' }}
          RANGE_DAYS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.range_days || '14' }}
        run: |
          case "$SOURCE_INPUT" in
            ""|de-bverfg|us-scotus|fr-conseil-constitutionnel|es-tribunal-constitucional) ;;
            *) echo "Invalid source input" >&2; exit 2 ;;
          esac
          case "$STRATEGY_INPUT" in
            auto|api|cheerio|playwright|sitemap|seed) ;;
            *) echo "Invalid strategy input" >&2; exit 2 ;;
          esac
          [[ "$LIMIT_INPUT" =~ ^[0-9]+$ ]] && (( LIMIT_INPUT >= 1 && LIMIT_INPUT <= 100 )) || exit 2
          [[ "$RANGE_DAYS_INPUT" =~ ^[0-9]+$ ]] && (( RANGE_DAYS_INPUT >= 1 && RANGE_DAYS_INPUT <= 730 )) || exit 2
      - name: Run direct P1 daily command pipeline
        if: (github.event_name != 'workflow_dispatch' || !inputs.m11_core_canary) && (github.event_name != 'workflow_dispatch' || inputs.source == '' || inputs.source == matrix.source) && env.ADMIN_QUEUE_V3_WORKER_ENABLED == 'true'
        env:
          LIMIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '20' }}
          STRATEGY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'auto' }}
          RANGE_DAYS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.range_days || '14' }}
        run: pnpm admin:worker:p1 -- --daily-pipeline --source=${{ matrix.source }} --limit="$LIMIT_INPUT" --strategy="$STRATEGY_INPUT" --range-days="$RANGE_DAYS_INPUT" --summary-limit=20 --summary-passes=4
      - name: Run isolated BVerfG worker without browser fallback
        if: (github.event_name != 'workflow_dispatch' || !inputs.m11_core_canary) && (github.event_name != 'workflow_dispatch' || inputs.source == '' || inputs.source == matrix.source) && env.ADMIN_QUEUE_V3_WORKER_ENABLED != 'true' && matrix.source == 'de-bverfg'
        env:
          LIMIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '20' }}
          STRATEGY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'auto' }}
          RANGE_DAYS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.range_days || '14' }}
        run: pnpm crawl:worker -- --source=de-bverfg --limit="$LIMIT_INPUT" --strategy="$STRATEGY_INPUT" --range-days="$RANGE_DAYS_INPUT" --refresh-existing --no-playwright --debug
      - name: Run isolated source worker
        if: (github.event_name != 'workflow_dispatch' || !inputs.m11_core_canary) && (github.event_name != 'workflow_dispatch' || inputs.source == '' || inputs.source == matrix.source) && env.ADMIN_QUEUE_V3_WORKER_ENABLED != 'true' && matrix.source != 'de-bverfg'
        env:
          LIMIT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '20' }}
          STRATEGY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'auto' }}
          RANGE_DAYS_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.range_days || '14' }}
        run: pnpm crawl:worker -- --source=${{ matrix.source }} --limit="$LIMIT_INPUT" --strategy="$STRATEGY_INPUT" --range-days="$RANGE_DAYS_INPUT" --refresh-existing --use-playwright --debug

  postprocess:
    name: Summarize and refresh public state
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs.m11_core_canary)
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_SETTINGS_SECRET: ${{ secrets.LLM_SETTINGS_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_SUMMARY_MODEL: ${{ secrets.OPENAI_COMPATIBLE_SUMMARY_MODEL }}
      EMBEDDING_PROVIDER: gemini
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}
      ADMIN_QUEUE_V3_WORKER_ENABLED: ${{ vars.ADMIN_QUEUE_V3_WORKER_ENABLED || 'false' }}
      ARTICLE_LIFECYCLE_P2_SHADOW_WRITE_ENABLED: ${{ vars.ARTICLE_LIFECYCLE_P2_SHADOW_WRITE_ENABLED || 'false' }}
      ARTICLE_LIFECYCLE_P2_SHADOW_COHORTS: ${{ vars.ARTICLE_LIFECYCLE_P2_SHADOW_COHORTS }}
      ADMIN_PUBLICATION_V4_SHADOW_WRITE_ENABLED: ${{ vars.ADMIN_PUBLICATION_V4_SHADOW_WRITE_ENABLED || 'false' }}
      ADMIN_PUBLICATION_V4_SHADOW_COHORTS: ${{ vars.ADMIN_PUBLICATION_V4_SHADOW_COHORTS }}
      ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED: ${{ vars.ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED || 'false' }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://worldcons.soltera.dev' }}
      WORLDCONS_BASE_URL: ${{ vars.WORLDCONS_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # M11.3 ops-heartbeat boundary for the summarize-pending step, same
      # defaults as the crawl job: authority "d1", base URL from a var,
      # OIDC audience from a var. No shared token secret.
      WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY: ${{ vars.WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY || 'd1' }}
      WORLDCONS_OPS_WRITE_BASE_URL: ${{ vars.WORLDCONS_OPS_WRITE_BASE_URL }}
      WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE: ${{ vars.WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE || 'worldcons-ops-write' }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Summarize pending articles
        if: env.ADMIN_QUEUE_V3_WORKER_ENABLED != 'true'
        run: pnpm summarize-pending -- --limit=20 --drain --strict --max-passes=4 --pass-delay-ms=65000 --retry-attempts=1 --retry-delay-ms=65000
      - name: Refresh public tag counts
        if: env.ADMIN_QUEUE_V3_WORKER_ENABLED != 'true' && env.ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED != 'true'
        run: pnpm refresh-tag-counts
      - name: Enforce site analytics retention
        run: pnpm analytics:retention
      - name: Revalidate production public caches
        if: env.ADMIN_QUEUE_V3_WORKER_ENABLED != 'true' && env.ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED != 'true'
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required" >&2
            exit 1
          fi
          BASE_URL="${WORLDCONS_BASE_URL:-https://worldcons.soltera.dev}"
          BASE_URL="${BASE_URL%/}"
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/admin/public-content/revalidate"
      - name: Deliver P3 publication cache outbox
        if: env.ADMIN_PUBLICATION_V4_OUTBOX_PROCESSOR_ENABLED == 'true'
        run: pnpm admin:publication:p3 -- --outbox --drain --max-passes=10 --worker="github-actions-${GITHUB_RUN_ID}" --limit=100 --lease-seconds=120
      - name: Require P2 and P3 publication parity
        if: env.ARTICLE_LIFECYCLE_P2_SHADOW_WRITE_ENABLED == 'true' && env.ADMIN_PUBLICATION_V4_SHADOW_WRITE_ENABLED == 'true'
        continue-on-error: ${{ vars.ADMIN_REQUIRE_PUBLICATION_PARITY != 'true' }}
        run: |
          pnpm admin:lifecycle:p2 --require-parity
          pnpm admin:publication:p3 -- --require-parity
