name: Gemini embedding backfill

# M11.3-OIDC: this job emits workflow heartbeats, so request a short-lived
# GitHub OIDC token (id-token: write) instead of the shared
# WORLDCONS_OPS_WRITE_TOKEN repository secret.
permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      m8_idempotency_key:
        description: Stable Cloudflare M8 orchestration identity
        required: false
        default: "manual"
      limit:
        description: Maximum rows scanned per pass
        required: false
        default: "50"
      max_passes:
        description: Bounded passes before yielding to the next run
        required: false
        default: "20"

concurrency:
  # Gemini routing state and provider quota are shared with collection/summary.
  group: admin-command-p1
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Gemini embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      M8_IDEMPOTENCY_KEY: ${{ github.event.inputs.m8_idempotency_key || format('manual:{0}', github.run_id) }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LLM_SETTINGS_SECRET: ${{ secrets.LLM_SETTINGS_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      EMBEDDING_PROVIDER: gemini
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}
      EMBEDDING_LIMIT_INPUT: ${{ github.event.inputs.limit || '50' }}
      EMBEDDING_PASSES_INPUT: ${{ github.event.inputs.max_passes || '20' }}
      # M11.3 ops-heartbeat boundary. Authority defaults to "supabase" so the
      # resting embedding heartbeat path is unchanged; the base URL is only
      # consulted when the authority is d1-canary/d1. The boundary is
      # authenticated with a per-job GitHub OIDC token (id-token: write above)
      # carrying the dedicated audience, so no shared repository secret is
      # required. WORLDCONS_OPS_WRITE_TOKEN is intentionally NOT set.
      WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY: ${{ vars.WORLDCONS_OPS_HEARTBEAT_WRITE_AUTHORITY || 'supabase' }}
      WORLDCONS_OPS_WRITE_BASE_URL: ${{ vars.WORLDCONS_OPS_WRITE_BASE_URL }}
      WORLDCONS_CORE_WRITE_AUTHORITY: ${{ vars.WORLDCONS_CORE_WRITE_AUTHORITY || 'supabase' }}
      WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE: ${{ vars.WORLDCONS_OPS_HEARTBEAT_OIDC_AUDIENCE || 'worldcons-ops-write' }}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run bounded resumable backfill
        run: pnpm backfill:embeddings -- --drain --limit="$EMBEDDING_LIMIT_INPUT" --max-passes="$EMBEDDING_PASSES_INPUT" --pass-delay-ms=65000
